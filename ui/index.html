<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>agent账号切换器</title>
    <link rel="icon" href="assets/mark.png" />
    <link rel="stylesheet" href="assets/icons.css" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="workspace" id="app" inert>
      <aside class="sidebar" aria-label="账号导航" id="sidebar">
        <div class="brand">
          <img src="assets/mark.png" alt="" width="44" height="44" />
          <strong><span>agent</span>账号切换器</strong>
        </div>
        <div class="sidebar-scroll">
          <div class="nav-heading">资料库</div>
          <nav id="library-nav" aria-label="资料库"></nav>
          <div class="nav-heading group-heading">
            我的分组<button
              type="button"
              class="icon-button tiny"
              data-action="new-group"
              title="新建分组"
              aria-label="新建分组"
            >
              <i class="i i-plus-lg"></i>
            </button>
          </div>
          <nav id="group-nav" aria-label="我的分组"></nav>
        </div>
        <button type="button" class="update-entry" data-action="updates"><i class="i i-arrow-repeat" aria-hidden="true"></i><span>软件更新</span><small id="update-badge"></small></button>
        <div class="sidebar-foot">
          <span class="device-icon"><i class="i i-shield-lock"></i></span>
          <div>
            <strong>本机存储</strong><small><b class="status-dot"></b>加密保护</small>
          </div>
          <button
            type="button"
            class="icon-button"
            data-action="settings"
            title="外观设置"
            aria-label="外观设置"
          >
            <i class="i i-sliders2"></i>
          </button>
        </div>
      </aside>
      <button
        type="button"
        class="nav-scrim"
        data-action="close-nav"
        aria-label="关闭导航"
        tabindex="-1"
      ></button>
      <div class="stage">
        <header class="toolbar">
          <div class="breadcrumb">
            <button
              type="button"
              class="icon-button nav-toggle"
              data-action="nav"
              aria-label="展开导航"
              aria-controls="sidebar"
              aria-expanded="false"
            >
              <i class="i i-layout-sidebar-inset"></i></button
            ><i class="i i-collection crumb-icon"></i><span class="crumb-root">资料库</span
            ><i class="i i-chevron-right crumb-chevron"></i><strong id="crumb-name">全部账号</strong>
          </div>
          <div class="toolbar-actions">
            <div class="search-box">
              <i class="i i-search"></i
              ><input
                id="search"
                type="search"
                aria-label="搜索账号"
                placeholder="搜索账号"
                autocomplete="off"
                spellcheck="false"
              /><kbd>Ctrl K</kbd
              ><button
                type="button"
                class="icon-button tiny"
                id="clear-search"
                data-action="clear-search"
                aria-label="清除搜索"
                hidden
              >
                <i class="i i-x-lg"></i>
              </button>
            </div>
            <button type="button" class="primary add-account" data-action="add">
              <i class="i i-plus-lg"></i><span>添加账号</span>
            </button>
          </div>
        </header>
        <main class="main-scroll" id="main" tabindex="-1">
          <div class="page-content">
            <section class="hero" id="hero" aria-labelledby="hero-title">
              <div class="hero-contours" aria-hidden="true"></div>
              <div class="hero-copy">
                <div class="hero-count">
                  <i class="i i-collection"></i><span id="hero-total">0 个账号</span>
                </div>
                <h1 id="hero-title">我的账号库</h1>
                <div class="hero-meta" id="hero-meta"></div>
              </div>
              <div class="hero-art" aria-hidden="true">
                <img src="assets/glass-pass.webp" alt="" draggable="false" />
              </div>
            </section>
            <section class="accounts-section" id="agent-section" aria-label="Agent 账号切换" hidden></section>
            <section class="groups-section" id="groups-section" aria-labelledby="groups-title">
              <div class="section-heading">
                <h2 id="groups-title">我的分组</h2>
                <button type="button" class="text-button" data-action="manage-groups">
                  管理分组<i class="i i-chevron-right"></i>
                </button>
              </div>
              <div class="group-cards" id="group-cards"></div>
            </section>
            <section class="accounts-section" id="accounts-section" aria-labelledby="accounts-title">
              <div class="section-heading">
                <div class="list-heading">
                  <h2 id="accounts-title">全部账号</h2>
                  <span class="count-chip" id="account-count">0</span>
                </div>
                <div class="list-tools">
                  <div class="sort-wrap">
                    <button
                      class="sort-button"
                      type="button"
                      data-action="sort-menu"
                      id="sort-button"
                      aria-expanded="false"
                      aria-controls="sort-menu"
                    >
                      <i class="i i-arrow-down-up"></i><span id="sort-label">最近更新</span
                      ><i class="i i-chevron-down"></i>
                    </button>
                    <div class="popover" id="sort-menu" hidden></div>
                  </div>
                  <div class="segment view-segment" role="group" aria-label="显示方式">
                    <span class="segment-thumb"></span
                    ><button
                      type="button"
                      data-action="view"
                      data-value="list"
                      title="列表视图"
                      aria-label="列表视图"
                    >
                      <i class="i i-list-ul"></i></button
                    ><button
                      type="button"
                      data-action="view"
                      data-value="grid"
                      title="网格视图"
                      aria-label="网格视图"
                    >
                      <i class="i i-grid"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div id="account-results"></div>
            </section>
          </div>
        </main>
      </div>
    </div>
    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"><div id="sheet-content"></div></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <div id="startup" class="startup">
      <img src="assets/mark.png" alt="" width="60" height="60" />
      <h1>agent账号切换器</h1>
      <p role="status">正在打开账号库…</p>
    </div>
  </body>
</html>
