name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable package
        run: python tools/package_release.py --tag "$env:RELEASE_TAG"
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            release/Agent-Account-Management-windows-x64.zip release/SHA256SUMS.txt `
            --verify-tag --title "agent账号切换器 $env:RELEASE_TAG" --generate-notes
